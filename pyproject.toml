[project]
name = "boston311"
version = "0.1.0"
description = "2025 crew planning and a GenAI intake assistant for four Boston 311 departments"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=2.0.0",
    "fastapi>=0.162.0",
    "fastembed>=0.9.1",
    "ipykernel>=7.4.0",
    "langchain>=1.4.9",
    "langchain-community>=0.4.2",
    "langchain-groq>=1.1.3",
    "matplotlib>=3.11.2",
    "pandas>=3.1.1",
    "pulp[cbc]>=4.2.0",
    "pyarrow>=26.0.1",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
    "scikit-learn>=1.9.1",
    "statsmodels>=0.15.0",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
