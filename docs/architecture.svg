<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1000" width="1100" height="1000" role="img" aria-labelledby="title desc">
  <title id="title">Boston 311 Crew Planner architecture</title>
  <desc id="desc">A resident's report goes from the browser through the web app and FastAPI to the intake agent, which calls Groq and falls back to a simpler pipeline on error. A planning request goes from FastAPI to the planning engine, where an optimizer and a daily simulator loop until the on-time target is met; the planning analyst agent answers questions with tools over the plan and the processed data. An offline pipeline turns Analyze Boston's 311 files into the processed data. All runtime parts run in one Docker container.</desc>
  <style>
    .bg { fill: #e9eae7; }
    .zone { fill: none; stroke: #5a6066; stroke-width: 1.4; }
    .zone.ext { stroke-dasharray: 6 5; }
    .card { fill: #fbfbfa; stroke: #c9cbc6; stroke-width: 1.4; }
    .card.ext { stroke: #5a6066; stroke-dasharray: 5 4; }
    .panel { fill: #fbfbfa; stroke: #c9cbc6; stroke-width: 1.4; }
    text { font-family: "Atkinson Hyperlegible", Arial, Helvetica, sans-serif; fill: #262a2e; }
    .h1 { font-family: Overpass, "Arial Narrow", Arial, sans-serif; font-size: 26px; font-weight: 700; }
    .sub { font-size: 14px; fill: #5a6066; }
    .zl { font-family: Overpass, "Arial Narrow", Arial, sans-serif; font-size: 13px; font-weight: 700; fill: #5a6066; }
    .t { font-family: Overpass, "Arial Narrow", Arial, sans-serif; font-size: 15px; font-weight: 700; }
    .b { font-size: 12.5px; fill: #5a6066; }
    .c { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; fill: #262a2e; }
    .lg { font-size: 12.5px; }
    .icon { fill: none; stroke: #262a2e; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
    .road { fill: none; stroke: #262a2e; stroke-width: 9; stroke-linejoin: round; }
    .lane { fill: none; stroke-width: 3; stroke-dasharray: 10 8; stroke-linejoin: round; }
    .green { stroke: #4cc38a; }
    .yellow { stroke: #f5c400; }
    .orange { stroke: #f26a21; }
    .wire { fill: none; stroke: #5a6066; stroke-width: 1.6; }
    .moving { animation: drive 0.9s linear infinite; }
    @keyframes drive { to { stroke-dashoffset: -18; } }
    @media (prefers-reduced-motion: reduce) { .moving { animation: none; } }
    .badge text { font-family: Overpass, "Arial Narrow", Arial, sans-serif; font-size: 12px; font-weight: 700; text-anchor: middle; }
  </style>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#262a2e"/>
    </marker>
    <marker id="head-wire" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#5a6066"/>
    </marker>
    <symbol id="i-window" viewBox="0 0 20 20"><rect class="icon" x="1.5" y="3" width="17" height="14" rx="2"/><path class="icon" d="M1.5 7 H18.5"/></symbol>
    <symbol id="i-server" viewBox="0 0 20 20"><rect class="icon" x="2" y="2.5" width="16" height="6" rx="1.5"/><rect class="icon" x="2" y="11.5" width="16" height="6" rx="1.5"/><path class="icon" d="M5 5.5 H7 M5 14.5 H7"/></symbol>
    <symbol id="i-agent" viewBox="0 0 20 20"><path class="icon" d="M3 3.5 H17 A1.5 1.5 0 0 1 18.5 5 V12.5 A1.5 1.5 0 0 1 17 14 H9 L5 17.5 V14 H3 A1.5 1.5 0 0 1 1.5 12.5 V5 A1.5 1.5 0 0 1 3 3.5 Z"/><path class="icon" d="M6 8.75 H6.1 M10 8.75 H10.1 M14 8.75 H14.1"/></symbol>
    <symbol id="i-board" viewBox="0 0 20 20"><path class="icon" d="M2 18 H18 M5 18 V11 M10 18 V5 M15 18 V8"/></symbol>
    <symbol id="i-db" viewBox="0 0 20 20"><ellipse class="icon" cx="10" cy="4.5" rx="7" ry="2.5"/><path class="icon" d="M3 4.5 V15.5 C3 17 17 17 17 15.5 V4.5 M3 10 C3 11.5 17 11.5 17 10"/></symbol>
    <symbol id="i-cloud" viewBox="0 0 20 20"><path class="icon" d="M5.5 15.5 H15 A3.5 3.5 0 0 0 15 8.5 A5 5 0 0 0 5.6 9.2 A3.2 3.2 0 0 0 5.5 15.5 Z"/></symbol>
  </defs>

  <rect class="bg" width="1100" height="1000"/>

  <!-- title and legend -->
  <text class="h1" x="40" y="46">Boston 311 Crew Planner</text>
  <text class="sub" x="40" y="68">How a resident's report gets routed, and how the crew plan gets made</text>
  <path class="road" d="M690 30 H736"/><path class="lane green moving" d="M690 30 H736"/>
  <text class="lg" x="748" y="34">Intake flow: a report to a request type</text>
  <path class="road" d="M690 51 H736"/><path class="lane yellow moving" d="M690 51 H736"/>
  <text class="lg" x="748" y="55">Planning flow: crews, scenarios, questions</text>
  <path class="road" d="M690 72 H736"/><path class="lane orange" d="M690 72 H736"/>
  <text class="lg" x="748" y="76">Fallback: the pipeline answers if the agent fails</text>

  <!-- external -->
  <rect class="zone ext" x="20" y="88" width="1060" height="82" rx="10"/>
  <text class="zl" x="32" y="105">External</text>
  <rect class="card ext" x="40" y="112" width="200" height="48" rx="8"/>
  <use href="#i-window" x="52" y="118" width="18" height="18"/>
  <text class="t" x="78" y="132">Browser</text>
  <text class="b" x="52" y="152">residents and ops leads</text>
  <rect class="card ext" x="560" y="112" width="500" height="48" rx="8"/>
  <use href="#i-cloud" x="572" y="118" width="18" height="18"/>
  <text class="t" x="598" y="132">Groq API</text>
  <text class="b" x="572" y="152">gpt-oss-20b and gpt-oss-120b · called by both agents, and by build_kb.py offline</text>

  <!-- runtime -->
  <rect class="zone" x="20" y="186" width="1060" height="430" rx="10"/>
  <text class="zl" x="190" y="204">Runtime · one Docker container, port 8000</text>

  <rect class="card" x="40" y="214" width="200" height="130" rx="8"/>
  <use href="#i-window" x="52" y="222" width="18" height="18"/>
  <text class="t" x="78" y="236">Web app</text>
  <text class="b" x="52" y="262">React · Vite · TypeScript</text>
  <text class="b" x="52" y="282">Intake · Crew plan</text>
  <text class="b" x="52" y="300">Scenarios · Ask</text>
  <text class="b" x="52" y="326">calls relative /api paths</text>

  <rect class="card" x="290" y="214" width="220" height="130" rx="8"/>
  <use href="#i-server" x="302" y="222" width="18" height="18"/>
  <text class="t" x="328" y="236">FastAPI</text>
  <text class="c" x="302" y="260">POST /api/intake</text>
  <text class="c" x="302" y="277">POST /api/ask</text>
  <text class="c" x="302" y="294">GET  /api/plan</text>
  <text class="c" x="302" y="311">POST /api/plan/solve</text>
  <text class="c" x="302" y="328">GET  /api/forecast</text>

  <rect class="card" x="560" y="214" width="240" height="130" rx="8"/>
  <use href="#i-agent" x="572" y="222" width="18" height="18"/>
  <text class="t" x="598" y="236">Intake agent</text>
  <text class="c" x="572" y="260">search_request_types</text>
  <text class="c" x="572" y="277">get_request_types</text>
  <text class="b" x="572" y="302">≤ 6 tool calls, ToolStrategy</text>
  <text class="b" x="572" y="322">dept. and queue: lookup table</text>

  <rect class="card" x="850" y="214" width="210" height="130" rx="8"/>
  <use href="#i-agent" x="862" y="222" width="18" height="18"/>
  <text class="t" x="888" y="236">Pipeline fallback</text>
  <text class="b" x="862" y="262">retrieve 5 candidates</text>
  <text class="b" x="862" y="282">1 strict JSON-schema call</text>
  <text class="b" x="862" y="302">same response shape,</text>
  <text class="c" x="862" y="322">fallback_used = true</text>

  <rect class="card" x="40" y="380" width="470" height="130" rx="8"/>
  <use href="#i-db" x="52" y="388" width="18" height="18"/>
  <text class="t" x="78" y="402">Disk cache · data/cache</text>
  <text class="b" x="52" y="428">llm.sqlite: every LLM call, at temperature 0, with its model name</text>
  <text class="b" x="52" y="448">kb_index.json: the request-type knowledge base, embedded with</text>
  <text class="b" x="52" y="466">fastembed bge-small for the intake search</text>
  <text class="b" x="52" y="492">The Docker image builds the index, so the first report is fast</text>

  <rect class="card" x="560" y="380" width="240" height="130" rx="8"/>
  <use href="#i-agent" x="572" y="388" width="18" height="18"/>
  <text class="t" x="598" y="402">Planning analyst agent</text>
  <text class="c" x="572" y="426">get_plan · run_what_if</text>
  <text class="c" x="572" y="443">get_forecast</text>
  <text class="c" x="572" y="460">query_service_stats</text>
  <text class="b" x="572" y="490">number check on every answer</text>

  <rect class="card" x="840" y="380" width="220" height="130" rx="8"/>
  <use href="#i-board" x="852" y="388" width="18" height="18"/>
  <text class="t" x="878" y="402">Planning engine</text>
  <text class="b" x="852" y="428">MILP, PuLP/CBC: crews, hires,</text>
  <text class="b" x="852" y="446">releases, Parks seasonals</text>
  <text class="b" x="852" y="466">⇄ daily FIFO queue simulator</text>
  <text class="b" x="852" y="490">raise buffers until on time</text>

  <rect class="card" x="40" y="528" width="1020" height="72" rx="8"/>
  <use href="#i-db" x="52" y="536" width="18" height="18"/>
  <text class="t" x="78" y="550">Processed data · data/processed (small, committed)</text>
  <text class="b" x="52" y="574">forecast_2025.parquet · plans.json (6 named scenarios) · service_stats.parquet · request_types.csv · request_type_kb.json</text>
  <text class="b" x="52" y="591">monthly_demand.csv · daily_profile.csv · sla_profile.csv · the held-out eval sets</text>

  <!-- reads: thin wires -->
  <path class="wire" d="M680 510 V526" marker-end="url(#head-wire)"/>
  <path class="wire" d="M950 510 V526" marker-end="url(#head-wire)"/>
  <path class="wire" d="M955 214 V164" marker-end="url(#head-wire)"/>

  <!-- intake flow: green, animated -->
  <path class="road" d="M120 160 V206" marker-end="url(#head)"/><path class="lane green moving" d="M120 160 V206"/>
  <path class="road" d="M240 262 H282" marker-end="url(#head)"/><path class="lane green moving" d="M240 262 H282"/>
  <path class="road" d="M510 262 H552" marker-end="url(#head)"/><path class="lane green moving" d="M510 262 H552"/>
  <path class="road" d="M640 214 V168" marker-end="url(#head)"/><path class="lane green moving" d="M640 214 V168"/>

  <!-- fallback: orange, still -->
  <path class="road" d="M800 300 H842" marker-end="url(#head)"/><path class="lane orange" d="M800 300 H842"/>
  <text class="b" x="825" y="326" text-anchor="middle">on error</text>

  <!-- planning flow: yellow, animated on the main path -->
  <path class="road" d="M160 160 V206" marker-end="url(#head)"/><path class="lane yellow moving" d="M160 160 V206"/>
  <path class="road" d="M240 300 H282" marker-end="url(#head)"/><path class="lane yellow moving" d="M240 300 H282"/>
  <path class="road" d="M470 344 V362 H950 V372" marker-end="url(#head)"/><path class="lane yellow moving" d="M470 344 V362 H950 V372"/>
  <path class="road" d="M680 362 V372" marker-end="url(#head)"/><path class="lane yellow" d="M680 362 V372"/>
  <path class="road" d="M800 445 H832" marker-end="url(#head)"/><path class="lane yellow" d="M800 445 H832"/>

  <!-- flow badges -->
  <g class="badge"><circle cx="98" cy="200" r="11" fill="#006b3f"/><text x="98" y="204" fill="#ffffff">1</text></g>
  <g class="badge"><circle cx="262" cy="243" r="11" fill="#006b3f"/><text x="262" y="247" fill="#ffffff">2</text></g>
  <g class="badge"><circle cx="532" cy="243" r="11" fill="#006b3f"/><text x="532" y="247" fill="#ffffff">3</text></g>
  <g class="badge"><circle cx="620" cy="190" r="11" fill="#006b3f"/><text x="620" y="194" fill="#ffffff">4</text></g>
  <g class="badge"><circle cx="825" cy="281" r="11" fill="#f26a21" stroke="#262a2e" stroke-width="1.5"/><text x="825" y="285">5</text></g>
  <g class="badge"><circle cx="262" cy="320" r="11" fill="#f5c400" stroke="#262a2e" stroke-width="1.5"/><text x="262" y="324">6</text></g>
  <g class="badge"><circle cx="1040" cy="398" r="11" fill="#f5c400" stroke="#262a2e" stroke-width="1.5"/><text x="1040" y="402">7</text></g>
  <g class="badge"><circle cx="702" cy="379" r="11" fill="#f5c400" stroke="#262a2e" stroke-width="1.5"/><text x="702" y="383">8</text></g>
  <g class="badge"><circle cx="780" cy="398" r="11" fill="#f5c400" stroke="#262a2e" stroke-width="1.5"/><text x="780" y="402">9</text></g>

  <!-- offline pipeline -->
  <rect class="zone" x="20" y="636" width="1060" height="112" rx="10"/>
  <text class="zl" x="32" y="654">Offline pipeline · run once, in order: uv run python scripts/&lt;name&gt;.py</text>
  <rect class="card ext" x="40" y="668" width="150" height="62" rx="8"/>
  <text class="t" x="52" y="690">Analyze Boston</text>
  <text class="b" x="52" y="709">311 CSVs, 2023–2025</text>
  <text class="b" x="52" y="724">external</text>
  <rect class="card" x="210" y="668" width="130" height="62" rx="8"/>
  <text class="c" x="222" y="692">download_data</text>
  <text class="b" x="222" y="713">to data/raw</text>
  <rect class="card" x="360" y="668" width="170" height="62" rx="8"/>
  <text class="c" x="372" y="692">build_processed</text>
  <text class="b" x="372" y="713">clean, then aggregate</text>
  <rect class="card" x="550" y="668" width="150" height="62" rx="8"/>
  <text class="c" x="562" y="692">build_forecast</text>
  <text class="b" x="562" y="713">best of 3 methods</text>
  <rect class="card" x="720" y="668" width="150" height="62" rx="8"/>
  <text class="c" x="732" y="692">build_kb</text>
  <text class="b" x="732" y="713">Groq 120b, cached</text>
  <rect class="card" x="890" y="668" width="170" height="62" rx="8"/>
  <text class="c" x="902" y="692">build_plans</text>
  <text class="b" x="902" y="713">6 named scenarios</text>
  <path class="wire" d="M190 699 H206" marker-end="url(#head-wire)"/>
  <path class="wire" d="M340 699 H356" marker-end="url(#head-wire)"/>
  <path class="wire" d="M530 699 H546" marker-end="url(#head-wire)"/>
  <path class="wire" d="M700 699 H716" marker-end="url(#head-wire)"/>
  <path class="wire" d="M870 699 H886" marker-end="url(#head-wire)"/>
  <path class="wire" d="M445 668 V604" marker-end="url(#head-wire)"/>
  <path class="wire" d="M975 668 V604" marker-end="url(#head-wire)"/>

  <!-- bottom panels -->
  <rect class="panel" x="20" y="766" width="340" height="218" rx="10"/>
  <text class="t" x="36" y="792">Build</text>
  <text class="b" x="36" y="818">uv: Python 3.12, locked by uv.lock</text>
  <text class="b" x="36" y="838">npm: the React + Vite web app in web/</text>
  <text class="b" x="36" y="864">GitHub Actions on every PR: ruff, pytest,</text>
  <text class="b" x="36" y="882">oxlint, vitest and the web build</text>
  <text class="b" x="36" y="902">Manual workflows: LLM eval, notebook check</text>
  <text class="b" x="36" y="928">Docker: a Node stage builds web/dist, and a</text>
  <text class="b" x="36" y="946">uv stage runs uvicorn on port 8000</text>

  <rect class="panel" x="380" y="766" width="340" height="218" rx="10"/>
  <text class="t" x="396" y="792">Quality</text>
  <text class="b" x="396" y="818">Held-out sets: 45 intake messages and 15</text>
  <text class="b" x="396" y="836">analyst questions, drafted with AI help, then</text>
  <text class="b" x="396" y="854">chosen, edited and labelled by a teammate who</text>
  <text class="b" x="396" y="872">didn't build the agents</text>
  <text class="b" x="396" y="898">Number check: every number in an analyst</text>
  <text class="b" x="396" y="916">answer must come from a tool or the question</text>
  <text class="b" x="396" y="942">Tests run offline with scripted models, and</text>
  <text class="b" x="396" y="960">the planner is checked on hand-computed cases</text>

  <rect class="panel" x="740" y="766" width="340" height="218" rx="10"/>
  <text class="t" x="756" y="792">Request flow</text>
  <g class="badge"><circle cx="767" cy="813" r="9" fill="#006b3f"/><text x="767" y="817" fill="#ffffff">1</text></g>
  <text class="b" x="784" y="817">A resident writes on the Intake page</text>
  <g class="badge"><circle cx="767" cy="832" r="9" fill="#006b3f"/><text x="767" y="836" fill="#ffffff">2</text></g>
  <text class="b" x="784" y="836">The whole conversation goes to /api/intake</text>
  <g class="badge"><circle cx="767" cy="851" r="9" fill="#006b3f"/><text x="767" y="855" fill="#ffffff">3</text></g>
  <text class="b" x="784" y="855">The agent searches and looks up types</text>
  <g class="badge"><circle cx="767" cy="870" r="9" fill="#006b3f"/><text x="767" y="874" fill="#ffffff">4</text></g>
  <text class="b" x="784" y="874">Groq picks the request type, nothing else</text>
  <g class="badge"><circle cx="767" cy="889" r="9" fill="#f26a21" stroke="#262a2e" stroke-width="1.2"/><text x="767" y="893">5</text></g>
  <text class="b" x="784" y="893">On error, the pipeline answers instead</text>
  <g class="badge"><circle cx="767" cy="908" r="9" fill="#f5c400" stroke="#262a2e" stroke-width="1.2"/><text x="767" y="912">6</text></g>
  <text class="b" x="784" y="912">/api/plan and /api/plan/solve serve plans</text>
  <g class="badge"><circle cx="767" cy="927" r="9" fill="#f5c400" stroke="#262a2e" stroke-width="1.2"/><text x="767" y="931">7</text></g>
  <text class="b" x="784" y="931">The MILP and simulator loop until on time</text>
  <g class="badge"><circle cx="767" cy="946" r="9" fill="#f5c400" stroke="#262a2e" stroke-width="1.2"/><text x="767" y="950">8</text></g>
  <text class="b" x="784" y="950">Ask sends a question to the analyst agent</text>
  <g class="badge"><circle cx="767" cy="965" r="9" fill="#f5c400" stroke="#262a2e" stroke-width="1.2"/><text x="767" y="969">9</text></g>
  <text class="b" x="784" y="969">Numbers no tool returned are flagged</text>
</svg>
